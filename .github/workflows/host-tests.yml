name: Host regression tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure host tests
        run: cmake -S apps/fxGLMark/tests/host -B build/host-tests

      - name: Build host tests
        run: cmake --build build/host-tests --parallel 2

      - name: Run regression tests
        run: ctest --test-dir build/host-tests --output-on-failure

      - name: Build and test the calculator link library
        run: |
          cmake -S lib/cglink -B build/cglink -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build/cglink --parallel 2
          ctest --test-dir build/cglink --output-on-failure
